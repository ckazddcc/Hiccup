db_path: './candidates_1.db'
work_path: './results'

job_settings:
  vasp:
    system: 'VaspJet'
    gga: 'PE'
    pp: 'PBE'
    xc: 'PBE'
    lreal: 'Auto'
    kpts: [ 1, 1, 1 ]
    #ldautype: 2
    #ldau_luj:
    #  Cr:
    #    L: 2
    #    U: 3.0
    #    J: 0.9
    #lmaxmix: 4
    #ispin: 2
    isym: 0
    encut: 450
    ismear: 0
    sigma: 0.05
    algo: 'Normal'
    prec: 'Normal'
    nelm: 60
    nsw: 200
    ediff: 1.0e-4
    ediffg: -0.1
    ibrion: 2
    potim: 0.2
    isif: 0
    symprec: 1.0e-5
    nwrite: 1
    ncore: 4
    lwave: false
    lcharg: false
    txt: 'vaspout.txt'

  slurm:
    slurm_time: '7-00:00:00'
    slurm_partition: 'q1'
    nodes: 1
    tasks_per_node: 1
    cpus_per_task: 24
    vasp_version: 'vasp_gam'
    slurm_use_srun: false
    slurm_setup:
      - 'source /home/materdesign/applications/oneapi/setvars.sh --force'
      - 'export PATH=/home/materdesign/applications/vasp/vasp.6.3.2/bin:$PATH'
      - 'ulimit -s unlimited'
      - 'export I_MPI_HYDRA_BOOTSTRAP=ssh'
      - 'export VASP_PP_PATH=/home/materdesign/applications/vasp/POTCAR'

    # vaspjet:
    save_log: true
    print_log: true
