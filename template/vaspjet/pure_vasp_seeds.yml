db_path: './random_seeds_gen.db'
work_path: './results'

job_settings:
  vasp:
    system: 'VaspJet'
    gga: 'RP'
    pp: 'PBE'
    xc: 'PBE'
    lreal: 'Auto'
    kpts: [ 1, 1, 1 ]
    #ldautype: 2
    #ldau_luj:
    #  Cr:
    #    L: 2
    #    U: 3.0
    #    J: 0.9
    #lmaxmix: 4
    #ispin: 2
    isym: 0
    encut: 300
    ismear: 0
    sigma: 0.05
    algo: 'Normal'
    prec: 'Normal'
    nelm: 60
    nsw: 200
    ediff: 1.0e-4
    ediffg: -0.2
    ibrion: 2
    potim: 0.2
    isif: 0
    symprec: 1.0e-5
    nwrite: 1
    ncore: 4
    lwave: false
    lcharg: false
    txt: 'vaspout.txt'

  slurm:
    slurm_time: '7-00:00:00'
    slurm_partition: 'TIME'
    nodes: 1
    tasks_per_node: 1
    cpus_per_task: 24
    vasp_version: 'vasp_gam'
    slurm_use_srun: false
    slurm_setup:
      - 'source /home/chem/intel/bin/compilervars.sh intel64'
      - 'ulimit -s unlimited'
      - 'export PATH=/home/chem/apps/vasp/vasp6.3.2/ori:$PATH'
      - 'export VASP_PP_PATH=/home/materdesign/applications/vasp/POTCAR'

  # vaspjet:
  save_log: true
  print_log: true
