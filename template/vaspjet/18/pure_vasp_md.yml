db_path: './random_seeds.db'
work_path: './results'

job_settings:
  vasp:
    system: 'VaspJet'
    gga: 'RP'
    pp: 'PBE'
    xc: 'PBE'
    lreal: 'Auto'
    kpts: [ 1, 1, 1 ]
    #ldautype: 2
    #ldau_luj:
    #  Cr:
    #    L: 2
    #    U: 3.0
    #    J: 0.9
    #lmaxmix: 4
    #ispin: 2
    isym: 0
    encut: 300
    ismear: 0
    sigma: 0.05
    algo: 'Normal'
    prec: 'Normal'
    nelm: 60
    nsw: 10000
    ediff: 1.0e-4
    ediffg: -0.05
    ibrion: 0 # md
    iwavpr: 11 # md
    potim: 1 # md
    tebeg: 300 # md
    teend: 300 # md
    smass: 2 # md
    isif: 0
    symprec: 1.0e-5
    nwrite: 1
    ncore: 4
    lwave: false
    lcharg: false
    txt: 'vaspout.txt'

  slurm:
    slurm_time: '7-00:00:00'
    slurm_partition: 'CLUSTER'
    nodes: 1
    tasks_per_node: 1
    cpus_per_task: 24
    vasp_version: 'vasp_gam'
    slurm_use_srun: false
    slurm_setup:
      - 'source /home/fwtop/intel/parallel_studio_xe_2020.4.912/psxevars.sh intel64'
      - 'ulimit -s unlimited'
      - 'export PATH=/home/fwtop/Applications/vasp/vasp.6.3.2/bin:$PATH'
      - 'export VASP_PP_PATH=/home/fwtop/Applications/vasp/POTCAR'

  # vaspjet:
  save_log: true
  print_log: true
